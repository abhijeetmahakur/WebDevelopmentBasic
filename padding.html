<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .box{
           background-color: bisque;
           display: inline-block;
           font-size: 32px;       
           margin:20px;  
           vertical-align:middle; 
        }

        .equal-pad{
            padding:40px;
        }
        .pad-bottom{
            padding-bottom: 200px;
            padding-left: 50px;
            padding-right: 50px;
        }
        .pad-top{
            padding-top: 200px;
        }
        .corner{
            /* padding:top right bottom left; */
            margin:200px 0 0 200px;

        }
    </style>
</head>
<body>
    
    <div class="box">Hello BOX</div>
    <div class="box equal-pad">Hello BOX</div>
    <hr>
    <div class="box pad-bottom">TOP</div>
    <div class="box pad-top">TOP</div>

    <div class="box corner">Corner</div>

    <!-- TASK: place the content in the bottom right corner of the Container -->


</body>
</html>
