<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      
        .margin-box{
            background-color: bisque;
            width:300px;
            height:200px;
            border: 2px dashed black;            
        }
        .margin-box label{
            padding-left: 5px;
        }
        .border-box{
            background-color: white;
            width:80%;
            height:80%;
            margin: auto;      
            border: 2px solid black;;  
        }
        .padding-box{
            border: 2px dashed black;
            width:70%;
            height: 70%;
            margin: auto;                      
        }
        .content-box{
            border: 2px solid black;
            width:50%;
            margin: auto;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    
    <div class="margin-box">
        <label>margin</label>

        <div class="border-box">
            <label for="">border</label>

             <div class="padding-box">
                 <label for="">padding</label>

                    <div class="content-box">
                        <label for="">content</label>
                    </div>
            </div>
        </div>
    </div>

    
</body>
</html>
