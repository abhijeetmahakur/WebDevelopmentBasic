<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>

<input type="text" placeholder="Enter Age">
<button onclick="check()">Check Eligibility</button>

<script>
    // Task: use the HTML Input age instead of JS prompt Age

    function check(){
        age = prompt("Enter age")

        if(age >= 18){
            alert("Major")
        }
        else{
            alert("Minor")
        }
    }
</script>

</body>
</html>
