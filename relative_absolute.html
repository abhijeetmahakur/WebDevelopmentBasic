<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .box{
            background-color: bisque;
            width: fit-content;
            padding: 20px;
            font-size: 24px;
        }
        .box:nth-child(3){
            background-color: magenta;
            position: absolute;
            padding: 5px;
            left: 100px;
            top: 300px;
        }
    </style>
</head>
<body>
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>

</body>
</html>
