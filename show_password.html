<!DOCTYPE html>
<html lang="en">
<head>
    
</head>
<body>
    
   
    <input type="password" id="upass" placeholder="Password">
    <button id="togglebtn" onclick="togglePassword()">Show</button>


    <script>

        upassObj=document.getElementById("upass")
        togglebtnObj=document.getElementById("togglebtn")
    
        function togglePassword(){

            if(upassObj.type=="password"){
                upassObj.type="text"
                togglebtnObj.textContent="Hide"
            }
            else{
                upassObj.type="password"
                togglebtnObj.textContent="Show"
            }
            
            //Task: toggle the button text to Show / Hide
        }
    </script>

</body>
</html>
